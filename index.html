<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GENYON</title>
    <meta property="og:title" content="GENYON" />
    <meta property="og:site_name" content="GENYON" />
    <meta name="twitter:title" content="GENYON" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GENYON" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-translucent" (invece del default "default", che disegna la
         barra di stato con uno sfondo bianco a livello di sistema operativo,
         sopra qualunque cosa faccia la pagina) + viewport-fit=cover sopra:
         lascia che il contenuto/sfondo della pagina arrivi fin sotto
         l'orologio, invece della fascia bianca fissa di iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0E1B33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&family=Inter:ital,wght@0,400;0,700;0,800;1,400&family=Zen+Dots&display=swap" rel="stylesheet" />
    <style>
      html, body { touch-action: pan-x pan-y; overflow-x: hidden; }
      /* Safari/iOS non supporta in modo affidabile "background-attachment:
         fixed" (soprattutto in modalità app da home screen): l'immagine
         torna a scorrere via col dito insieme al contenuto come se quella
         proprietà non fosse mai stata scritta. "position: fixed" è un
         meccanismo diverso, supportato ovunque incluso iOS: un elemento a
         sé, dietro a tutto ("z-index: -1"), che resta sempre ancorato al
         viewport qualunque sia lo scroll — le card restano sempre bianche/
         piene sopra (cardStyle, invariato) */
      #sfondo-app {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #F7F5EF;
        /* nessuna immagine qui: la sceglie lo script in fondo, prima del
           primo disegno. Scritta nel CSS, quella di serie compariva
           sempre e veniva sostituita un istante dopo da quella scelta in
           Aspetto dell'app — un lampo del vecchio sfondo a ogni avvio */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* con viewport-fit=cover (sopra) il contenuto normale arriverebbe fin
         sotto la barra di stato/notch: serve rimandarlo giù quel tanto che
         basta. Il padding va sul contenitore React di ogni schermata (con
         box-sizing:border-box, vedi App.jsx), non su "body": su "body"
         quel padding si sommerebbe SEMPRE all'altezza del contenuto,
         rendendo il documento scrollabile di quel tanto anche quando il
         contenuto reale sta già tutto in una schermata — quel piccolo
         scorrimento "a vuoto" è quello che sembrava restare "incollato"
         in alto/in basso una volta tolto il rimbalzo elastico. Lo sfondo,
         essendo "position:fixed", non ha comunque mai bisogno di questo
         padding e copre sempre tutto */
      /* campi disabilitati (scheda iscritto in sola lettura): restano
         bloccati ma il testo deve leggersi bene, non solo grigio chiaro.
         -webkit-text-fill-color serve perche' Safari/iOS ignora "color"
         sui controlli disabled e mostra comunque un grigio molto chiaro */
      fieldset:disabled input,
      fieldset:disabled select,
      fieldset:disabled textarea {
        color: #0E1B33 !important;
        -webkit-text-fill-color: #0E1B33 !important;
        opacity: 1 !important;
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="sfondo-app"></div>
    <script>
      // Lo sfondo, deciso prima che l'app parta.
      //
      // L'immagine scelta in Aspetto dell'app vive sul server, e arriva
      // dopo un giro di rete. Fino a ieri nel frattempo si vedeva quella
      // di serie, che poi spariva: un lampo del vecchio sfondo a ogni
      // avvio. Qui si legge la copia tenuta nel browser e si dipinge
      // subito quella giusta; l'app poi la conferma o la aggiorna.
      //
      // La scelta fra telefono e computer usa la stessa soglia del resto
      // dell'app (700 px).
      (function () {
        var el = document.getElementById("sfondo-app");
        if (!el) return;
        var scelta = null;
        try { scelta = JSON.parse(window.localStorage.getItem("edc_sfondo_app") || "null"); } catch (e) { scelta = null; }
        var telefono = window.innerWidth <= 700;
        var url = (scelta && (telefono ? scelta.mobile : scelta.desktop))
          || (telefono ? "/sfondo-app-mobile.jpg" : "/sfondo-app-desktop.jpg");
        el.style.backgroundImage = 'url("' + url + '")';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
