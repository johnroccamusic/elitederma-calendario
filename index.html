<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gestionale Elitederma</title>
    <meta property="og:title" content="Gestionale Elitederma" />
    <meta property="og:site_name" content="Gestionale Elitederma" />
    <meta name="twitter:title" content="Gestionale Elitederma" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GENYON" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0E1B33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Inter:ital,wght@0,400;0,700;0,800;1,400&family=Zen+Dots&display=swap" rel="stylesheet" />
    <style>
      html, body { touch-action: pan-x pan-y; overflow-x: hidden; }
      /* sfondo decorativo di tutta l'app: solo dietro le pagine, le card
         restano sempre bianche/piene sopra (cardStyle, invariato) — due
         immagini, verticale su mobile e orizzontale da 701px in su, stesso
         breakpoint di useIsMobile() in App.jsx */
      body {
        background-color: #F7F5EF;
        background-image: url("/sfondo-app-mobile.jpg");
        /* "auto 100%" invece di "cover": forza SEMPRE la copertura
           verticale completa (mai un bordo bianco sopra/sotto), a costo
           di tagliare di più i lati se la pagina è più stretta/larga del
           previsto — esattamente il compromesso richiesto */
        background-size: auto 100%;
        background-position: top center;
        background-repeat: no-repeat;
      }
      @media (min-width: 701px) {
        body { background-image: url("/sfondo-app-desktop.jpg"); }
      }
      /* campi disabilitati (scheda iscritto in sola lettura): restano
         bloccati ma il testo deve leggersi bene, non solo grigio chiaro.
         -webkit-text-fill-color serve perche' Safari/iOS ignora "color"
         sui controlli disabled e mostra comunque un grigio molto chiaro */
      fieldset:disabled input,
      fieldset:disabled select,
      fieldset:disabled textarea {
        color: #0E1B33 !important;
        -webkit-text-fill-color: #0E1B33 !important;
        opacity: 1 !important;
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
